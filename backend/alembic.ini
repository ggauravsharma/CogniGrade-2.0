# Alembic configuration for CogniGrade.
#
# Run from the repository root (or from /app inside the backend image):
#
#     alembic -c backend/alembic.ini upgrade head
#
# `%(here)s` is the directory holding THIS file, so the script location resolves
# correctly no matter what the working directory is.
#
# NOTE: `sqlalchemy.url` is deliberately absent. The database URL -- which
# carries the password -- is read by migrations/env.py from the same place the
# application reads it (backend.config.settings.DATABASE_URL, i.e. the
# DATABASE_URL environment variable), so no credential is ever written into a
# tracked file. Set ALEMBIC_DATABASE_URL to point a migration run at a
# different database without touching the application's configuration.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
