worker_processes  1;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    # Allow requests up to 50MB
    client_max_body_size 50M;

    # Docker's embedded DNS server.
    #
    # nginx resolves a host name written literally in `proxy_pass` exactly ONCE,
    # when the configuration is loaded, and then reuses that address for the
    # life of the worker. `docker compose up -d --build` recreates the backend
    # and frontend containers, and a recreated container can come back on a
    # DIFFERENT address on the compose network -- so nginx kept dialling the
    # address the old container had. Every /api/ request answered
    # `502 Bad Gateway` (nginx logged `connect() failed (111: Connection
    # refused) ... upstream: http://<old ip>:8000/...`) while the backend
    # itself was healthy, and only `docker restart portal_nginx` cleared it.
    #
    # Naming each upstream through a VARIABLE below defers the lookup to
    # request time, which needs an explicit resolver. `valid=10s` caps how long
    # an answer is reused, so a recreated container is picked up on its own
    # within seconds. `ipv6=off` because the compose network is IPv4 only and
    # the AAAA lookup is a pointless failure on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Proxy /api/... to backend, stripping /api prefix
        location /api/ {
            # Resolved per request -- see the resolver note above. The variable
            # carries no path, so the URI the rewrite produced is what is
            # proxied, exactly as with the literal form.
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Document extraction is SYNCHRONOUS today: the browser holds the
            # request open while the model reads a question paper. nginx's
            # default proxy_read_timeout is 60s, which is shorter than the
            # backend's own configured budget, so nginx cut the connection,
            # answered 504, and the professor was told the server could not be
            # reached -- while FastAPI carried on and committed the extraction.
            #
            # 600s is derived from that budget, not guessed. For one file:
            #   backend/ai/config.py  document_extraction / label_extraction
            #                         timeout_seconds = 180, max_retries = 2
            #   providers/gemini.py   asyncio.wait_for(budget + 5) per attempt
            #   ai/retry.py           attempts = max_retries + 1 = 3,
            #                         full-jitter backoff <= 1s then <= 2s
            #   worst case  3 x 185 + 3  =  558s
            # 600s covers that with margin and stops there. A section holding
            # SEVERAL files can still exceed it, which is exactly why the
            # frontend now reports a gateway timeout as "still processing,
            # check the status" rather than as a failure.
            #
            # Nothing about the AI timeout or retry policy is changed here;
            # this only stops the proxy from being the shorter of the two.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # All other traffic to frontend
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
        }
    }
}
